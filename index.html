<!DOCTYPE html>
<html lang="de" class="staticrypt-html">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Nordstern Marketing</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<style>
            :root {
                --bg: #ffffff;
                --card: #ffffff;
                --ink: #14213d;
                --muted: #5c667a;
                --line: #dfe3ea;
                --field: #f4f6fa;
                --blue: #1f4fd8;
                --on-blue: #ffffff;
                --accent: #e8b931;
                --on-accent: #14213d;
                --shadow: 0 1px 2px rgba(20, 33, 61, 0.06), 0 12px 40px rgba(20, 33, 61, 0.10);
            }
            
            * { box-sizing: border-box; }
            .staticrypt-html { height: 100%; }
            .staticrypt-body { height: 100%; margin: 0; background: var(--bg); }
            .hidden { display: none !important; }

            .staticrypt-content {
                min-height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                background: var(--bg);
                color: var(--ink);
                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
                line-height: 1.5;
                -webkit-font-smoothing: antialiased;
            }
            .staticrypt-page { width: 100%; max-width: 420px; }
            .staticrypt-form {
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 28px;
                box-shadow: var(--shadow);
                padding: 44px 36px 36px;
                text-align: center;
            }
            .staticrypt-title {
                margin: 0 0 12px;
                font-size: 30px;
                font-weight: 700;
                letter-spacing: -0.02em;
            }
            .staticrypt-title span { color: var(--accent); }
            .staticrypt-instructions p { margin: 0; }
            .staticrypt-instructions p + p { color: var(--muted); font-size: 15px; }
            .staticrypt-instructions { margin-bottom: 28px; }

            .staticrypt-password-container { position: relative; margin: 0 0 14px; }
            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                width: 100%;
                border: 1px solid var(--line);
                border-radius: 999px;
                background: var(--field);
                color: var(--ink);
                font: inherit;
                font-size: 16px;
                padding: 15px 50px 15px 22px;
                outline: 0;
            }
            .staticrypt-form input[type="password"]:focus,
            .staticrypt-form input[type="text"]:focus {
                border-color: var(--blue);
                box-shadow: 0 0 0 3px rgba(31, 79, 216, 0.18);
            }
            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 18px;
                width: 18px;
                padding: 0;
                opacity: 0.55;
                position: absolute;
                right: 20px;
                top: 50%;
                transform: translateY(-50%);
            }
            
            .staticrypt-form .staticrypt-decrypt-button {
                width: 100%;
                border: 0;
                border-radius: 999px;
                background: var(--blue);
                color: var(--on-blue);
                font: inherit;
                font-size: 16px;
                font-weight: 600;
                padding: 15px 24px;
                cursor: pointer;
                outline: 0;
                text-transform: none;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active {
                background: var(--accent);
                color: var(--on-accent);
                filter: none;
            }
            .staticrypt-form .staticrypt-decrypt-button:focus-visible {
                outline: 3px solid var(--accent);
                outline-offset: 3px;
            }
            .staticrypt-error { margin: 0 0 14px; color: #c0392b; font-size: 14px; }
            

            .staticrypt-spinner-container { height: 100%; display: flex; align-items: center; justify-content: center; }
            .staticrypt-spinner {
                width: 2rem; height: 2rem; border: 0.25em solid var(--line); border-right-color: transparent;
                border-radius: 50%; animation: spinner-border 0.75s linear infinite;
            }
            @keyframes spinner-border { 100% { transform: rotate(360deg); } }
        
.staticrypt-error { color: #b3261e; font-size: 14px; margin: 12px 0 0; min-height: 18px; }
</style>
</head>
